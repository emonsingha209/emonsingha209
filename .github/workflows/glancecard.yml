name: glancecard

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gfazioli/glancecard@v0.3.0
        with:
          profile: emonsingha209
          theme: both
          time-zone: Asia/Dhaka
